services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tms_db
    ports:
      - "5432:5432"
    volumes:
      - tms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tms_db"]
      interval: 5s
      retries: 5

volumes:
  tms-data:
